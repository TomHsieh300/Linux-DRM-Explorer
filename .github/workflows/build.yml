name: build

on:
  push:
  pull_request:

jobs:
  native:
    name: Native build (x86_64, -Werror)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libdrm-dev shellcheck
      - name: Build all experiments
        run: make EXTRA_CFLAGS=-Werror
      - name: Check shell scripts
        run: |
          if ls tools/*.sh >/dev/null 2>&1; then shellcheck tools/*.sh; fi

  cross-aarch64:
    name: Cross build (aarch64, -Werror)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable arm64 multiarch (ports.ubuntu.com)
        run: |
          sed -i '/^URIs: http:\/\/\(archive\|security\).ubuntu.com/a Architectures: amd64' \
            /etc/apt/sources.list.d/ubuntu.sources
          cat > /etc/apt/sources.list.d/ports.sources <<'SRC'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SRC
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y --no-install-recommends make pkg-config gcc-aarch64-linux-gnu libc6-dev-arm64-cross libdrm-dev:arm64
      - name: Cross-compile all experiments
        run: |
          make CROSS_COMPILE=aarch64-linux-gnu- \
               PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig \
               EXTRA_CFLAGS=-Werror
